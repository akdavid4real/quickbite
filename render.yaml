services:
  - type: web
    name: quickbite-api
    runtime: docker
    rootDir: QuickBite
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/restaurants
    autoDeployTrigger: commit
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: DEMO_DATA_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: quickbite-web
          property: host

  - type: web
    name: quickbite-web
    runtime: static
    rootDir: frontend
    buildCommand: pnpm build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: quickbite-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
