spring.datasource.url=jdbc:h2:mem:quickbite;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.demo-data.enabled=false

app.jwt.secret=test_jwt_secret_that_is_long_enough_for_hmac_signing
app.jwt.expiration=86400000

paystack.secret.key=test_paystack_secret
paystack.base.url=https://api.paystack.co

delivery.fee.tier1.maxKm=3
delivery.fee.tier1.amount=500
delivery.fee.tier2.maxKm=7
delivery.fee.tier2.amount=800
delivery.fee.tier3.maxKm=15
delivery.fee.tier3.amount=1200
delivery.fee.tier4.amount=2000

logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
