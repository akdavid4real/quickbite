spring.application.name=QuickBite

server.port=${PORT:9909}

spring.datasource.url=${DB_URL:jdbc:sqlite:quickbite.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8081}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}


paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.base.url=${PAYSTACK_BASE_URL:https://api.paystack.co}


#google.maps.api.key=your_google_maps_api_key_here
#google.maps.distance.matrix.url=https://maps.googleapis.com/maps/api/distancematrix/json


delivery.fee.tier1.maxKm=3
delivery.fee.tier1.amount=500

delivery.fee.tier2.maxKm=7
delivery.fee.tier2.amount=800

delivery.fee.tier3.maxKm=15
delivery.fee.tier3.amount=1200

delivery.fee.tier4.amount=2000


springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true



logging.level.org.hibernate.SQL=${HIBERNATE_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.com.debbiecyber.QuickBite=${APP_LOG_LEVEL:INFO}
